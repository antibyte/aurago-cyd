[platformio]
default_envs = cyd

[env]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200
board_build.partitions = partitions/cyd.csv
lib_deps =
	bodmer/TFT_eSPI@2.5.43
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
	bblanchon/ArduinoJson@^7.2.1
	tzapu/WiFiManager@^2.0.17
	links2004/WebSockets@^2.6.1
	ricmoo/QRCode@0.0.1
build_flags =
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_GFXFF
	-DFIRMWARE_VERSION=\"0.2.1\"
	-DCORE_DEBUG_LEVEL=0

[env:cyd]
build_flags =
	${env.build_flags}
	-DILI9341_2_DRIVER
	-DCYD_VARIANT=\"cyd\"

[env:cyd2usb]
build_flags =
	${env.build_flags}
	-DST7789_DRIVER
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_OFF
	-DCYD_VARIANT=\"cyd2usb\"
